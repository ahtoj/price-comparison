spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.flyway.enabled=true
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.schemas=${DB_SCHEMA:public}
spring.flyway.locations=classpath:db/migration/${DB_SCHEMA:public}
google.oauth2.clientId=${GOOGLE_CLIENT_ID}
google.oauth2.clientSecret=${GOOGLE_CLIENT_SECRET}
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.access-secret-key=${AWS_SECRET_ACCESS_KEY}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
# HMAC_SHA256("key", "The quick brown fox jumps over the lazy dog")
secret=f7bc83f430538424b13298e6aa6fb143ef4d59a14946175997479dbc2d1a3cd8
debug=false
server.servlet.context-path=/
logging.level.root=WARN
logging.level.org.springframework=DEBUG
logging.level.com.shopleech=DEBUG
logging.file.name=${java.io.tmpdir}/app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%
springdoc.packages-to-scan=com.shopleech.publicapi.controller
aws.region=${AWS_REGION:eu-west-1}
aws.bucket.name=${AWS_BUCKET_NAME:price-comparison-images}
aws.bucket.folder=product/

