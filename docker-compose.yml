# Local development: PostgreSQL + API + client, built from source.
# On a fresh start (empty volume) the API runs the Flyway migrations, which create
# the schema and insert the seed data (db/migration/public/*.sql).
#   docker compose up --build        start
#   docker compose down -v           reset the database
# Deployment uses docker-stack.yml (Swarm, no database).
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-price_comparison}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./public-api
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-price_comparison}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-price-comparison-images}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./price-comparison-client1
      dockerfile: Dockerfile
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL:-http://localhost:8080}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db-data:
