name: Deploy backend application to docker

on:
  push:
    branches:
      - main
    paths:
      - "public-api/**"
      - ".github/workflows/public-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-api-deploy
  cancel-in-progress: false

env:
  WORK_DIR: public-api
  ECR_REPOSITORY: sl-public-api
  LAMBDA_FUNCTION: sl-public-api

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        working-directory: ${{ env.WORK_DIR }}
        run: ./gradlew test --no-daemon

      - name: Resolve image version
        id: version
        run: |
          VERSION=$(sed -nE "s/^version = '([^']+)'.*/\1/p" ${{ env.WORK_DIR }}/build.gradle)
          echo "tag=v${VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to Amazon ECR
        id: build-image
        working-directory: ${{ env.WORK_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --provenance=false -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Trigger on-prem Docker Swarm deploy
        env:
          WEBHOOK_URL: ${{ vars.SWARM_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.SWARM_WEBHOOK_TOKEN }}
          IMAGE: ${{ steps.build-image.outputs.image }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Posts JSON {"service": "public-api", "image": "<image>", "tag": "<tag>", "sha": "<sha>"} to webhook URL
          PAYLOAD=$(jq -nc \
            --arg service "public-api" \
            --arg image "$IMAGE" \
            --arg tag "$IMAGE_TAG" \
            --arg sha "$GITHUB_SHA" \
            '{service: $service, image: $image, tag: $tag, sha: $sha}')
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 60 \
            -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Verify on-prem Docker Swarm deploy
        env:
          WEBHOOK_URL: ${{ vars.SWARM_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.SWARM_WEBHOOK_TOKEN }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Polls GET <webhook>?service=public-api&tag=<tag>; expects JSON {"state": "...", "tag": "..."}
          for i in $(seq 1 30); do
            RESPONSE=$(curl --silent --show-error --max-time 30 -G "$WEBHOOK_URL" \
              -H "Authorization: Bearer $WEBHOOK_TOKEN" \
              --data-urlencode "service=public-api" \
              --data-urlencode "tag=$IMAGE_TAG" || true)
            STATE=$(echo "$RESPONSE" | jq -r '.state // empty' 2>/dev/null || true)
            RUNNING_TAG=$(echo "$RESPONSE" | jq -r '.tag // empty' 2>/dev/null || true)
            echo "Attempt $i: state=${STATE:-unknown} tag=${RUNNING_TAG:-unknown}"
            if [ "$STATE" = "completed" ] && [ "$RUNNING_TAG" = "$IMAGE_TAG" ]; then
              echo "Swarm deploy of $IMAGE_TAG succeeded"
              exit 0
            fi
            if [ "$STATE" = "failed" ] || [ "$STATE" = "rollback_completed" ]; then
              echo "::error::Swarm deploy of $IMAGE_TAG failed: $RESPONSE"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for swarm to deploy $IMAGE_TAG"
          exit 1
