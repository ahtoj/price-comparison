name: Deploy backend application to docker

on:
  push:
    branches:
      - main
    paths:
      - "public-api/**"
      - ".github/workflows/public-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-api-deploy
  cancel-in-progress: false

env:
  WORK_DIR: public-api
  ECR_REPOSITORY: sl-public-api
  LAMBDA_FUNCTION: sl-public-api

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        working-directory: ${{ env.WORK_DIR }}
        run: ./gradlew test --no-daemon

      - name: Resolve image version
        id: version
        run: |
          VERSION=$(sed -nE "s/^version = '([^']+)'.*/\1/p" ${{ env.WORK_DIR }}/build.gradle)
          echo "tag=v${VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to Amazon ECR
        id: build-image
        working-directory: ${{ env.WORK_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --provenance=false -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

