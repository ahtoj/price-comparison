name: Deploy client application to Amazon S3

on:
  push:
    branches:
      - main
    paths:
      - "price-comparison-client1/**"
      - ".github/workflows/price-comparison-client1.yml"
  workflow_dispatch:

env:
  WORK_DIR: price-comparison-client1
  DIST_LOCATION_CODE: ./dist

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run install
        working-directory: ${{ env.WORK_DIR }}
        run: npm install

      - name: Run build
        working-directory: ${{ env.WORK_DIR }}
        run: npm run build

      - name: Deploying application to Amazon S3
        uses: dvelasquez/deploy-s3-action@main
        with:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
          # BUCKET_PATH: "/pr/${{github.event.number}}"
          BUCKET_PATH: ""
          DIST_LOCATION_CODE: ${{ env.DIST_LOCATION_CODE }}

      - name: Invalidate CloudFront cache
        uses: chetan/invalidate-cloudfront-action@v1.0.0
        with:
          distribution-id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          paths: "/*"
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
